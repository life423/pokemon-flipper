<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />

        <title>Pokemon Flipper</title>

        <link
            rel="icon"
            type="image/x-icon"
            href="/assets/icons/favicon.ico"
        />

        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/assets/icons/favicon-32x32.png"
        />

        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/assets/icons/favicon-16x16.png"
        />
    </head>

    <body>
        <h1>Pokemon Flipper</h1>

        <form id="searchForm">
            <label for="search">Search Pokemon cards</label>

            <input
                id="search"
                type="text"
                placeholder="Charizard, Lugia, etc."
            />

            <button type="submit">Search</button>
        </form>

        <label for="sort">Sort by</label>

        <select id="sort">
            <option value="ending">Ending soonest</option>
            <option value="profit">Highest profit</option>
            <option value="roi">Highest ROI</option>
            <option value="price">Lowest current price</option>
        </select>

        <label for="minRoi">Minimum ROI</label>

        <input
            id="minRoi"
            type="number"
            min="0"
            step="1"
            value="0"
        />

        <span>%</span>

        <label for="minCost">Minimum cost</label>
        <span>$</span>
        <input
            id="minCost"
            type="number"
            min="0"
            step="1"
            placeholder="No minimum"
        />

        <label for="maxCost">Maximum cost</label>
        <span>$</span>
        <input
            id="maxCost"
            type="number"
            min="0"
            step="1"
            placeholder="No maximum"
        />

        <label for="minProfit">Minimum profit</label>
        <span>$</span>
        <input
            id="minProfit"
            type="number"
            min="0"
            step="1"
            placeholder="No minimum"
        />

        <div id="results"></div>

        <script type="module" src="/client.js"></script>
    </body>
</html>
